<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Pureview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
        color: #333;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      #main-content {
        flex-grow: 1;
        padding: 20px;
      }
      /* Styling tambahan untuk router-content-container */
      .router-content-container {
        min-height: 100px;
        border: 1px dashed #a0aec0; /* Warna abu-abu Tailwind */
        padding: 15px;
        border-radius: 8px; /* Sudut membulat */
        background-color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      nav a {
        padding: 8px 12px;
        border-radius: 6px;
        text-decoration: none;
        color: #2b6cb0; /* Biru Tailwind */
        font-weight: 500;
        transition: background-color 0.2s ease-in-out;
      }
      nav a:hover {
        background-color: #ebf8ff; /* Biru muda Tailwind */
      }
      footer {
        background-color: #2d3748; /* Abu-abu gelap Tailwind */
        color: #e2e8f0; /* Abu-abu terang Tailwind */
        text-align: center;
        padding: 15px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="nav-container"></div>
    <div id="main-content"></div>
    <div id="footer-container"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
